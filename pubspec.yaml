name: exercise_app
# The user-facing name is "Baseline"; the Dart package keeps its original
# identifier, which appears in imports only and is not worth a repo-wide churn.
description: "Baseline — an offline tracker for cardio and strength training."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Persistence: SQLite via Drift (type-safe SQL, versioned migrations,
  # in-memory instances for tests).
  drift: ">=2.23.0 <2.32.0"
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.6

  # State management / DI. Chosen for `ProviderContainer` overrides in tests.
  flutter_riverpod: ^3.3.2

  # Plan-file import validation.
  json_schema: ^5.2.2

  # Rest timer alerts (local only; no network).
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # Progress charts.
  fl_chart: ^1.2.0

  intl: ^0.20.3
  collection: ^1.19.1
  path: ^1.9.1
  file_selector: ^1.1.0

# `path_provider_foundation` is the iOS/macOS implementation of path_provider.
# We build only Android and Windows, so it is never executed — but from 2.5.0 it
# depends on `objective_c`, which declares native build hooks that this Dart
# version's build_runner cannot compile. Pinning it below that boundary keeps
# code generation working and has no effect on the platforms we ship.
dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ">=2.23.0 <2.32.0"
  build_runner: ^2.15.1
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  sqlite3: ">=2.0.0 <3.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/schema/
    - assets/schema/examples/
